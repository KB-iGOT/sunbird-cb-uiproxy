sonar.projectKey=sun-ui-proxies
sonar.projectName=sun-ui-proxies
sonar.projectVersion=1.0.0
sonar.projectDescription=Static analysis for the web-services
sonar.sources=src
sonar.tests=tests/unit
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/docs/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# whitelistApis.ts is a static route/role allowlist table; its repeated entry shape is data, not duplicated logic
# profile-details.ts (legacy) and profile-details-v2.ts (its replacement) plus tests are excluded temporarily until the legacy file is removed
sonar.cpd.exclusions=src/utils/whitelistApis.ts,src/protectedApi_v8/user/profile-details.ts,src/protectedApi_v8/user/profile-details-v2.ts,tests/unit/protectedApi_v8/user/profile-details*.test.ts
